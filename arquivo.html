<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de gastos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF3F4;--surface:#fff;--ink:#12242B;--muted:#5D7078;--line:#D5E0E3;--in:#0E7C66;--out:#C23B5A;--accent:#12242B;--onaccent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A1F;--surface:#15272E;--ink:#E6EFF1;--muted:#8FA5AD;--line:#26404A;--in:#3CCBA8;--out:#F07A93;--accent:#E6EFF1;--onaccent:#0D1A1F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1A1F;--surface:#15272E;--ink:#E6EFF1;--muted:#8FA5AD;--line:#26404A;--in:#3CCBA8;--out:#F07A93;--accent:#E6EFF1;--onaccent:#0D1A1F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:600;margin:0 0 12px}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.month{display:flex;align-items:center;gap:6px}
.month button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.month strong{min-width:140px;text-align:center;text-transform:capitalize}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.hero .lbl{color:var(--muted);font-size:.9rem}
.saldo{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.pair{display:flex;gap:28px;margin-top:14px;flex-wrap:wrap}
.pair b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--out)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:760px){.grid{grid-template-columns:340px 1fr;align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg label{text-align:center;padding:10px;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center}
.seg input{position:absolute;opacity:0;width:0;min-height:0}
.seg input:checked+span{font-weight:600}
.seg label:has(input:checked){background:var(--accent);color:var(--onaccent)}
.seg label:has(input:focus-visible){outline:2px solid var(--in);outline-offset:-2px}
.f{margin-bottom:12px}.f label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;min-height:46px;border:0;border-radius:10px;background:var(--accent);color:var(--onaccent);font-weight:600;cursor:pointer}
.cat{margin-bottom:10px}.cat .t{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:3px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--out);border-radius:4px}
.budget{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.budget .bar i{background:var(--in)}.budget .bar i.over{background:var(--out)}
ul{list-style:none;margin:0;padding:0}
li.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
li.tx:last-child{border:0}
.tx .d{flex:1;min-width:0}.tx .d b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .d small{color:var(--muted)}
.tx .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{background:none;border:0;color:var(--muted);cursor:pointer;width:44px;height:44px;border-radius:8px;font-size:1.1rem}
.x:hover{color:var(--out)}
.empty{color:var(--muted);padding:12px 0}
.gap{display:grid;gap:16px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;min-height:44px}
</style>
</head>
<body>
<main>
<header>
  <h1>Controle de gastos</h1>
  <div class="month">
    <button id="prev" aria-label="Mês anterior">‹</button>
    <strong id="mlabel"></strong>
    <button id="next" aria-label="Próximo mês">›</button>
  </div>
</header>

<section class="hero" aria-live="polite">
  <div class="lbl">Saldo do mês</div>
  <div class="saldo" id="saldo">R$ 0,00</div>
  <div class="pair">
    <div><span class="lbl">Receitas</span><b class="in" id="tin">R$ 0,00</b></div>
    <div><span class="lbl">Gastos</span><b class="out" id="tout">R$ 0,00</b></div>
  </div>
</section>

<div class="grid">
  <section class="card">
    <h2>Novo lançamento</h2>
    <div id="form">
      <div class="seg" role="radiogroup" aria-label="Tipo">
        <label><input type="radio" name="tipo" value="out" checked><span>Gasto</span></label>
        <label><input type="radio" name="tipo" value="in"><span>Receita</span></label>
      </div>
      <div class="f"><label for="desc">Descrição</label><input id="desc" maxlength="60" placeholder="Ex.: Mercado"></div>
      <div class="row2">
        <div class="f"><label for="val">Valor (R$)</label><input id="val" inputmode="decimal" placeholder="0,00"></div>
        <div class="f"><label for="date">Data</label><input id="date" type="date"></div>
      </div>
      <div class="f"><label for="cat">Categoria</label>
        <select id="cat">
          <option>Alimentação</option><option>Moradia</option><option>Transporte</option><option>Saúde</option>
          <option>Lazer</option><option>Educação</option><option>Compras</option><option>Contas</option><option>Outros</option>
        </select>
      </div>
      <button class="btn" id="add">Adicionar lançamento</button>
      <div class="empty" id="err" role="alert" style="color:var(--out);padding:8px 0 0"></div>
    </div>
  </section>

  <div class="gap">
    <section class="card">
      <h2>Gastos por categoria</h2>
      <div id="cats"></div>
      <div class="budget">
        <div class="f" style="margin-bottom:8px"><label for="lim">Limite de gastos do mês (R$)</label><input id="lim" inputmode="decimal" placeholder="Opcional, ex.: 3000"></div>
        <div id="bud"></div>
      </div>
    </section>
    <section class="card">
      <h2>Lançamentos</h2>
      <ul id="list"></ul>
      <button class="link" id="clear">Apagar todos os dados</button>
    </section>
  </div>
</div>
</main>

<script>
(function(){
  var KEY="gastos:v1", data={tx:[],limit:0}, cur=new Date();
  cur=new Date(cur.getFullYear(),cur.getMonth(),1);
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.tx))data=p;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var brl=function(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})};
  var ym=function(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
  var today=function(){var d=new Date();return ym(d)+"-"+String(d.getDate()).padStart(2,"0")};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  $("date").value=today();
  if(data.limit)$("lim").value=String(data.limit).replace(".",",");

  function parse(v){var n=parseFloat(String(v).trim().replace(/\./g,"").replace(",","."));return isNaN(n)?0:n}

  function render(){
    $("mlabel").textContent=cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    var key=ym(cur);
    var items=data.tx.filter(function(t){return t.date.slice(0,7)===key}).sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id});
    var tin=0,tout=0,cats={};
    items.forEach(function(t){if(t.type==="in")tin+=t.value;else{tout+=t.value;cats[t.cat]=(cats[t.cat]||0)+t.value}});
    var saldo=tin-tout;
    $("tin").textContent=brl(tin);$("tout").textContent=brl(tout);
    var s=$("saldo");s.textContent=brl(saldo);s.className="saldo "+(saldo<0?"out":"in");

    var entries=Object.keys(cats).map(function(k){return[k,cats[k]]}).sort(function(a,b){return b[1]-a[1]});
    $("cats").innerHTML=entries.length?entries.map(function(e){
      var pct=tout?Math.round(e[1]/tout*100):0;
      return '<div class="cat"><div class="t"><span>'+esc(e[0])+'</span><span>'+brl(e[1])+' ('+pct+'%)</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
    }).join(""):'<div class="empty">Nenhum gasto neste mês ainda.</div>';

    var b=$("bud");
    if(data.limit>0){
      var r=tout/data.limit,over=r>1;
      b.innerHTML='<div class="bar"><i class="'+(over?"over":"")+'" style="width:'+Math.min(100,Math.round(r*100))+'%"></i></div><div class="empty" style="padding:6px 0 0;color:'+(over?"var(--out)":"var(--muted)")+'">'+
        (over?"Você passou "+brl(tout-data.limit)+" do limite.":"Restam "+brl(data.limit-tout)+" do limite de "+brl(data.limit)+".")+'</div>';
    } else b.innerHTML="";

    $("list").innerHTML=items.length?items.map(function(t){
      var d=t.date.split("-");
      return '<li class="tx"><div class="d"><b>'+esc(t.desc)+'</b><small>'+d[2]+'/'+d[1]+' • '+esc(t.cat)+'</small></div>'+
        '<div class="v '+t.type+'">'+(t.type==="in"?"+ ":"− ")+brl(t.value)+'</div>'+
        '<button class="x" data-id="'+t.id+'" aria-label="Excluir '+esc(t.desc)+'">✕</button></li>';
    }).join(""):'<li class="empty">Nenhum lançamento neste mês. Adicione o primeiro ao lado.</li>';
  }

  function add(){
    var desc=$("desc").value.trim(),val=parse($("val").value),date=$("date").value,
        type=document.querySelector('input[name="tipo"]:checked').value;
    if(!desc){$("err").textContent="Informe uma descrição.";return}
    if(!(val>0)){$("err").textContent="Informe um valor maior que zero.";return}
    if(!date){$("err").textContent="Escolha uma data.";return}
    $("err").textContent="";
    data.tx.push({id:Date.now(),desc:desc,value:val,date:date,type:type,cat:type==="in"?"Receita":$("cat").value});
    save();
    cur=new Date(+date.slice(0,4),+date.slice(5,7)-1,1);
    $("desc").value="";$("val").value="";$("desc").focus();
    render();
  }

  $("add").onclick=add;
  ["desc","val"].forEach(function(id){$(id).addEventListener("keydown",function(e){if(e.key==="Enter")add()})});
  $("list").onclick=function(e){
    var id=e.target.getAttribute&&e.target.getAttribute("data-id");
    if(id){data.tx=data.tx.filter(function(t){return String(t.id)!==id});save();render()}
  };
  $("prev").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
  $("next").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
  $("lim").oninput=function(){data.limit=parse(this.value);save();render()};
  $("clear").onclick=function(){
    if(confirm("Apagar todos os lançamentos? Isso não pode ser desfeito.")){data={tx:[],limit:0};$("lim").value="";save();render()}
  };
  render();
})();
</script>
</body>
</html>
